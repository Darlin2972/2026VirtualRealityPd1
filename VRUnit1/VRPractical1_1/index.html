 <a-entity class="truck3 ">

<a-circle position="-0.8 1 -2" src="tires.webp" rotation="0 -90 90" radius="1"></a-circle>

<a-box position=" 2.5 2 -3" rotation="0 90 0" width="0.2" height="0.4" color="black"></a-box>

<a-plane position="4.6 2 9.1" rotation="0 0 90"height="1.4" color="yellow" ></a-plane>
<a-plane position="0.6 2 9.1" rotation="0 0 90"height="1.4" color="yellow" ></a-plane>
<a-plane position="2.5 1.2 9.1"  width="2" src="plate.webp"></a-plane>
<a-plane position="2.5 1.2 -3.1"  width="2" rotation="0 180 0" src="plate.webp"></a-plane>


  <!--windows-->
<a-plane position="2.5 3.8 9.1"  width="6" height="2.3" color="cyan" ></a-plane>
<a-plane position="-0.6 3.8 7"  width="2.8" height="2" rotation="0 -90 0" color="cyan" ></a-plane>
<a-plane position="5.6 3.8 7"  width="2.8" height="2" rotation="0 90 0" color="cyan" ></a-plane>


  <!--crate for the back truck-->
<a-entity class="crates">
<a-box position="2.4 2.3 2.5" width="3" height="3" rotation="90 0 0" src="crate.webp" ></a-box>
</a-entity>
